version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /mudplot-editor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns: ["*"]
