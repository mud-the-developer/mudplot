name: TeX engine matrix

# The heavier half of P1-5's matrix (see mudplot_v0.3_improvement_and_
# reference_repos.md): every push/PR already runs the fast, self-contained
# Tectonic combination as part of ci.yml. Installing a full TeX Live (real
# pdflatex/lualatex + classic BibTeX + biblatex/biber) is too slow to
# justify on every commit, so it only runs nightly, on a release tag, or on
# request -- real coverage (a citation-numbering regression in one engine's
# text-measurement, or in how mudplot escapes something for a particular
# bibliography backend, wouldn't necessarily show up under Tectonic alone)
# without slowing down normal development.

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tex-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          # A once-daily job installing a multi-hundred-MB TeX Live has no
          # need for uv's own dependency cache, and the default is enabled
          # on GitHub-hosted runners -- explicitly off (rather than relying
          # on the default) removes any cache-persistence attack surface.
          enable-cache: false
      - name: Install project (with dev extras)
        run: uv sync --extra dev
      - name: Install TeX Live (pdflatex, lualatex, BibTeX, biblatex/biber) + ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-pictures \
            texlive-bibtex-extra \
            biber \
            ghostscript
      - name: TeX engine/bibliography matrix (pdflatex+bibtex, lualatex+bibtex, lualatex+biblatex)
        run: uv run pytest tests/test_references.py -k compiles_into_a_real_paper -v
