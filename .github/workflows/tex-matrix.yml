name: TeX engine matrix

# The push/PR suite and release workflow install XeLaTeX for Matplotlib PGF
# measurement and the other engines for document tests. This separate nightly
# and on-demand job explicitly checks the pdfLaTeX/LuaLaTeX document matrix
# with classic BibTeX and biblatex/biber.

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tex-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: "3.12"
          # A once-daily job installing a multi-hundred-MB TeX Live has no
          # need for uv's own dependency cache, and the default is enabled
          # on GitHub-hosted runners -- explicitly off (rather than relying
          # on the default) removes any cache-persistence attack surface.
          enable-cache: false
      - name: Audit all committed Python dependency locks
        run: uv run --locked --script scripts/audit_dependencies.py
      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev
      - name: Install TeX Live engines, bibliography tools, and ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-xetex \
            texlive-luatex \
            texlive-pictures \
            texlive-bibtex-extra \
            biber \
            ghostscript
      - name: Run TeX engine and bibliography matrix
        run: >-
          uv run pytest tests/test_references.py
          -k compiles_into_a_real_paper -v --junitxml=tex-results.xml
      - name: Required full TeX paths executed
        if: always()
        run: >-
          uv run --no-sync python
          scripts/check_required_test_paths.py tex tex-results.xml
      - name: Retain TeX outcomes including skips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-tex-${{ github.sha }}
          path: tex-results.xml
          if-no-files-found: error
