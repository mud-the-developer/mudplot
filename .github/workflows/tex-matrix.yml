name: TeX engine matrix

# The heavier half of P1-5's matrix (see mudplot_v0.3_improvement_and_
# reference_repos.md): every push/PR already runs the fast, self-contained
# Tectonic combination as part of ci.yml. Installing a full TeX Live (real
# pdflatex/lualatex + classic BibTeX + biblatex/biber) is too slow to
# justify on every commit, so it runs nightly or on request. release.yml runs
# the same full toolchain as a publish gate. A citation-numbering regression in
# one engine's text measurement, or in how mudplot escapes something for a
# particular bibliography backend, would not necessarily appear under
# Tectonic alone.

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tex-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          # A once-daily job installing a multi-hundred-MB TeX Live has no
          # need for uv's own dependency cache, and the default is enabled
          # on GitHub-hosted runners -- explicitly off (rather than relying
          # on the default) removes any cache-persistence attack surface.
          enable-cache: false
      - name: Audit all committed Python dependency locks
        run: uv run --locked --script scripts/audit_dependencies.py
      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev
      - name: Install TeX Live engines, bibliography tools, and ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-luatex \
            texlive-pictures \
            texlive-bibtex-extra \
            biber \
            ghostscript
      - name: Run TeX engine and bibliography matrix
        run: >-
          uv run pytest tests/test_references.py
          -k compiles_into_a_real_paper -v
