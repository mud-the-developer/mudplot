name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: python-${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"
      - name: Audit all committed Python dependency locks
        if: matrix.python-version == '3.12'
        run: uv run --locked --script scripts/audit_dependencies.py
      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev --extra browser
      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium
      - name: Install pdflatex + tectonic (TeX engines for the .pgf-export
          reference tests; the fuller pdflatex/lualatex/biber matrix runs
          nightly in tex-matrix.yml and before publishing in release.yml)
        # pdflatex (texlive-latex-base/-recommended/-pictures) is matplotlib's
        # pgf.texsystem for the base .pgf-export tests (tests/conftest.py
        # picks it over the xelatex default, since xelatex's Ubuntu package
        # drags in nearly a full texlive-latex-extra tree for no benefit
        # here); tectonic is a pinned release tarball fetched directly from
        # GitHub over HTTPS, not the project's own "curl | sh" one-liner
        # installer, to avoid piping a remote script straight into a shell
        # (at the cost of bumping TECTONIC_VERSION by hand occasionally).
        env:
          TECTONIC_VERSION: "0.15.0"
          TECTONIC_SHA256: >-
            875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            ghostscript
          curl --retry 3 --retry-all-errors -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_SHA256}  tectonic.tar.gz" \
            | sha256sum --check --strict
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          rm tectonic.tar.gz
          tectonic --version
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: >-
          uv run pytest -q --durations=25
          --junitxml=ci-results-${{ matrix.python-version }}.xml
      - name: Required browser and TeX paths executed
        if: always()
        run: >-
          uv run --no-sync python
          scripts/check_required_test_paths.py ci
          ci-results-${{ matrix.python-version }}.xml
      - name: Retain Python test outcomes including skips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: >-
            test-results-python-${{ matrix.python-version }}-${{ github.sha }}
          path: ci-results-${{ matrix.python-version }}.xml
          if-no-files-found: error
      - name: Optional table adapters with real libraries
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync --with pyarrow==26.0.0 \
            --with polars==2.0.0 python - <<'PY'
          import pyarrow
          import polars
          import pytest
          print(f"PyArrow {pyarrow.__version__}; Polars {polars.__version__}")
          raise SystemExit(pytest.main([
              "-q", "tests/test_review_table_formats.py",
              "tests/test_review_temporal_precision.py",
              "tests/test_review_scalar_boundaries.py",
              "tests/test_review_missing_data.py",
              "tests/test_review_sql_ownership.py",
              "tests/test_review_data_contracts.py", "tests/test_data.py",
              "tests/test_no_deps.py",
          ]))
          PY
      - name: Schema/docs export is in sync (drift guard for Rust + humans)
        run: uv run python scripts/check_schema_sync.py
      - name: Dashboard site builds
        run: uv run python -m dashboard build --out /tmp/dashboard_build
      - name: Dashboard editor smoke test
        run: uv run python scripts/editor_smoke_test.py
      - name: Rust editor real-browser smoke test
        if: matrix.python-version == '3.12'
        run: uv run python scripts/rust_editor_smoke_test.py --browser
      - name: Sdist/wheel rebuild and contents are complete
        run: uv run python scripts/check_wheel.py

  minimum-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv for the isolated dependency floor
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.10"
          cache-suffix: minimum-python-3.10
          cache-dependency-glob: |
            uv.lock
            scripts/check_minimum_versions.py.lock
      - name: Install the same locked tooling as the full matrix
        run: uv sync --locked --extra dev --extra browser
      - name: Retain font/system dependencies without browser download
        run: uv run --no-sync playwright install-deps chromium
      - name: Install the same TeX prerequisites as the full matrix
        env:
          TECTONIC_VERSION: "0.15.0"
          TECTONIC_SHA256: >-
            875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            ghostscript
          curl --retry 3 --retry-all-errors -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_SHA256}  tectonic.tar.gz" \
            | sha256sum --check --strict
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          rm tectonic.tar.gz
          tectonic --version
      - name: Minimum render dependency contract
        env:
          PYTEST_ADDOPTS: "--junitxml=minimum-results.xml"
        run: >-
          uv run --python 3.10 --locked --script
          scripts/check_minimum_versions.py
      - name: Required minimum TeX paths executed
        if: always()
        run: >-
          uv run --no-sync python
          scripts/check_required_test_paths.py minimum minimum-results.xml
      - name: Retain minimum test outcomes including skips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-minimum-${{ github.sha }}
          path: minimum-results.xml
          if-no-files-found: error

  rust-editor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv and complete Python effects for smoke fixtures
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.12"
          cache-suffix: rust-${{ matrix.os }}-python-3.12
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra all
      - name: Rust 1.88 MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --all-targets \
            --manifest-path mudplot-editor/Cargo.toml
      - name: Rust format
        run: cargo fmt --check --manifest-path mudplot-editor/Cargo.toml
      - name: Rust lint
        run: >-
          cargo clippy --locked --all-targets
          --manifest-path mudplot-editor/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path mudplot-editor/Cargo.toml
      - name: Rust/Python editor bridge smoke test
        run: uv run python scripts/rust_editor_smoke_test.py
      - name: Interpreter selection and Unicode/spaced paths
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MPLBACKEND: Agg
        run: uv run --no-sync python scripts/check_python_bridge_paths.py
      - name: Sequential request-body boundaries and server RSS
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          MPLBACKEND: Agg
        run: uv run --no-sync python scripts/check_request_body_limits.py
