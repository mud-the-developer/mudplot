name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"
      - name: Audit all committed Python dependency locks
        if: matrix.python-version == '3.12'
        run: uv run --locked --script scripts/audit_dependencies.py
      - name: Install project (with dev extras)
        run: uv sync --locked --extra dev --extra browser
      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium
      - name: Install pdflatex + tectonic (TeX engines for the .pgf-export
          reference tests; the fuller pdflatex/lualatex/biber matrix runs
          nightly in tex-matrix.yml and before publishing in release.yml)
        # pdflatex (texlive-latex-base/-recommended/-pictures) is matplotlib's
        # pgf.texsystem for the base .pgf-export tests (tests/conftest.py
        # picks it over the xelatex default, since xelatex's Ubuntu package
        # drags in nearly a full texlive-latex-extra tree for no benefit
        # here); tectonic is a pinned release tarball fetched directly from
        # GitHub over HTTPS, not the project's own "curl | sh" one-liner
        # installer, to avoid piping a remote script straight into a shell
        # (at the cost of bumping TECTONIC_VERSION by hand occasionally).
        env:
          TECTONIC_VERSION: "0.15.0"
          TECTONIC_SHA256: >-
            875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-pictures \
            ghostscript
          curl --retry 3 --retry-all-errors -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_SHA256}  tectonic.tar.gz" \
            | sha256sum --check --strict
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/
          rm tectonic.tar.gz
          tectonic --version
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -q
      - name: Minimum render dependency contract
        if: matrix.python-version == '3.10'
        run: >-
          uv run --python 3.10 --locked --script
          scripts/check_minimum_versions.py
      - name: Schema/docs export is in sync (drift guard for Rust + humans)
        run: uv run python scripts/check_schema_sync.py
      - name: Dashboard site builds
        run: uv run python -m dashboard --out /tmp/dashboard_build
      - name: Dashboard editor smoke test
        run: uv run python scripts/editor_smoke_test.py
      - name: Rust editor real-browser smoke test
        if: matrix.python-version == '3.12'
        run: uv run python scripts/rust_editor_smoke_test.py --browser
      - name: Sdist/wheel rebuild and contents are complete
        run: uv run python scripts/check_wheel.py

  rust-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv and Python render bridge
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra render
      - name: Rust 1.88 MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --all-targets \
            --manifest-path mudplot-editor/Cargo.toml
      - name: Rust format
        run: cargo fmt --check --manifest-path mudplot-editor/Cargo.toml
      - name: Rust lint
        run: >-
          cargo clippy --locked --all-targets
          --manifest-path mudplot-editor/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path mudplot-editor/Cargo.toml
      - name: Rust/Python editor bridge smoke test
        run: uv run python scripts/rust_editor_smoke_test.py
