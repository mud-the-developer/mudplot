name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"
      - name: Install project (with dev extras)
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check mudplot tests dashboard
      - name: Pytest
        run: uv run pytest -q
      - name: Schema/docs export is in sync (drift guard for Rust + humans)
        run: uv run python scripts/check_schema_sync.py
      - name: Dashboard site builds
        run: uv run python -m dashboard --out /tmp/dashboard_build
      - name: Dashboard editor smoke test
        run: uv run python scripts/editor_smoke_test.py
      - name: Wheel builds and includes py.typed + LICENSE
        run: |
          uv pip install build
          uv run python scripts/check_wheel.py
