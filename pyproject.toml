[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mudplot"
version = "0.6.0"
description = "Declarative, reproducible scientific plotting with exact sizing and CVD-aware palettes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mud" }]
keywords = [
    "matplotlib",
    "color-palette",
    "colorblind-aware",
    "LCH",
    "CIELAB",
    "scientific-plotting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Matplotlib",
]
# The pure engine (spec / actions / reducer / store / io / tex sizing) needs
# nothing beyond the standard library. Numerics and rendering are opt-in.
dependencies = []

[project.urls]
Homepage = "https://github.com/mud-the-developer/mudplot"
Repository = "https://github.com/mud-the-developer/mudplot"
Changelog = "https://github.com/mud-the-developer/mudplot/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/mud-the-developer/mudplot/blob/main/ROADMAP.md"

[project.scripts]
mudplot = "mudplot.__main__:main"

[project.optional-dependencies]
color = ["numpy>=1.23"]                       # colour engine (LCH, CVD, palettes)
render = ["numpy>=1.23", "matplotlib>=3.8"]   # native title wrapping + rendering
all = ["mudplot[render]"]
dev = [
    "mudplot[render]",
    "pytest>=9.0.3",
    "ruff>=0.6",
    "pyright>=1.1.390",
    "pandas>=2",
    "jsonschema>=4",
    "hypothesis>=6",
    "build>=1",
    "hatchling==1.32.0",
]
# Real-browser tests for the dashboard editor (tests/test_editor_browser.py).
# Separate from `dev` because it also needs a browser binary installed
# (`playwright install chromium`); the suite skips those tests without it.
browser = ["mudplot[dev]", "playwright>=1.40"]

[tool.hatch.build]
exclude = ["/src/pretext/**", "/src/SciencePlots/**", "/mudplot-editor/target/**"]

[tool.hatch.build.targets.wheel]
packages = ["mudplot"]

[tool.ruff]
line-length = 88
indent-width = 4
src = ["mudplot", "tests"]
extend-exclude = ["src/SciencePlots", ".venv", "*.md", "gallery"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E741",  # ambiguous variable name (L, C are meaningful in colour code)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # matplotlib.use('Agg') before imports in tests

[tool.pyright]
include = ["mudplot", "dashboard", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
